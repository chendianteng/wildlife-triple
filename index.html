function makeNodes(){
  const nodes=[];let id=0;
  if(mode==='easy')return Array.from({length:18},(_,i)=>({id:'b'+i,kind:'board',z:0,x:375+(i%6)*84,y:164+Math.floor(i/6)*90,active:true,type:Math.floor(i/3)%3}));

  for(let z=6;z>=0;z--){const ids=shuffle(state.nodes.filter(n=>n.kind==='board'&&n.z===z).map(n=>n.id));order.push(...ids)}
  const left=state.nodes.filter(n=>n.kind==='left').sort((a,b)=>b.stackIndex-a.stackIndex).map(n=>n.id);
  const right=state.nodes.filter(n=>n.kind==='right').sort((a,b)=>b.stackIndex-a.stackIndex).map(n=>n.id);
  // interleave side stacks modestly, preserving a legal peel order
  const side=[...left,...right];let si=0,merged=[];
  order.forEach((id,i)=>{merged.push(id);if(i%7===5&&si<side.length)merged.push(side[si++]);if(i%11===7&&si<side.length)merged.push(side[si++])});while(si<side.length)merged.push(side[si++]);
  // total is 198, divisible by 3
  let last=-1;
  for(let i=0;i<merged.length;i+=3){let t=Math.floor(Math.random()*TYPES.length);if(t===last)t=(t+1+Math.floor(Math.random()*(TYPES.length-1)))%TYPES.length;last=t;for(let k=0;k<3;k++)state.byId.get(merged[i+k]).type=t}
}
function snapshot(){return{types:state.nodes.map(n=>n.type),matches:state.matches,active:state.nodes.map(n=>n.active),tray:state.tray.map(x=>({...x})),reserve:state.reserve.map(x=>({...x})),tools:{...state.tools},ended:state.ended}}
function restore(s){state.nodes.forEach((n,i)=>{n.active=s.active[i];n.type=s.types[i]});state.matches=s.matches;state.tray=s.tray.map(x=>({...x}));state.reserve=s.reserve.map(x=>({...x}));state.tools={...s.tools};state.ended=s.ended;hideEnd();renderAll()}
function save(){state.history.push(snapshot());if(state.history.length>40)state.history.shift()}
function renderEnd(){if(!state.outcome)return;document.querySelector('#endCard h2').textContent=t(state.outcome);document.querySelector('#endCard p').textContent=t(state.outcome==='win'?(mode==='easy'?'easyWin':'winText'):'loseText');document.querySelector('#classicNext').hidden=!(mode==='easy'&&state.outcome==='win')}
function end(outcome){state.ended=true;state.outcome=outcome;pause();if(session){session.completed=outcome==='win';session.outcome=outcome}track(outcome==='win'?'game_complete':'game_over',{outcome,matches:state.matches});renderEnd();overlay.classList.add('show');document.querySelector('#replayBtn').focus()}
function hideEnd(){overlay.classList.remove('show');state.outcome=null}
function animateMatch(type,indices){
  const game=document.querySelector('#game').getBoundingClientRect(),scale=game.width/1536;
  indices.forEach(index=>{const slot=trayEl.children[index].getBoundingClientRect(),ghost=document.createElement('span');ghost.className='match-ghost';ghost.textContent=TYPES[type];ghost.style.left=((slot.left-game.left)/scale+(slot.width/scale-66)/2)+'px';ghost.style.top=((slot.top-game.top)/scale)+'px';document.querySelector('#effects').appendChild(ghost);ghost.addEventListener('animationend',()=>ghost.remove(),{once:true});setTimeout(()=>ghost.remove(),500)});
}
function addToTray(type){
  let idx=-1;for(let i=state.tray.length-1;i>=0;i--)if(state.tray[i].type===type){idx=i;break}
  state.feedback=null;
  const e={type,uid:Math.random().toString(36).slice(2)};idx<0?state.tray.push(e):state.tray.splice(idx+1,0,e);
  let same=state.tray.filter(x=>x.type===type).length;
  if(same>=3){animateMatch(type,state.tray.map((x,i)=>x.type===type?i:-1).filter(i=>i>=0).slice(0,3));state.matches++;state.feedback='match';track('triple_match',{matches:state.matches,tray_count:state.tray.length-3});let removed=0;state.tray=state.tray.filter(x=>{if(x.type===type&&removed<3){removed++;return false}return true})}
  if(state.tray.length===7)return 'lose';
  const any=state.nodes.some(n=>n.active)||state.reserve.length;if(!any&&state.tray.length===0)return 'win';
  return null;
}
function clickNode(id){if(state.ended)return;const n=state.byId.get(id);if(!n||!n.active||blocked(n))return;save();n.active=false;const out=addToTray(n.type);renderAll();if(out)end(out)}
function renderBoard(){boardEl.innerHTML='';state.nodes.filter(n=>n.kind==='board'&&n.active).sort((a,b)=>a.z-b.z||a.y-b.y||a.x-b.x).forEach(n=>{const b=document.createElement('button');b.className='tile '+(blocked(n)?'blocked':'clickable');b.style.left=n.x+'px';b.style.top=n.y+'px';b.style.zIndex=1000+n.z*1000+Math.round(n.y);b.textContent=TYPES[n.type];b.dataset.id=n.id;b.disabled=blocked(n);b.setAttribute('aria-label',TYPES[n.type]+' '+t(b.disabled?'blockedLabel':'clearLabel'));if(isHint(n))b.classList.add('hint');b.onclick=()=>clickNode(n.id);boardEl.appendChild(b)})}
function renderStack(el,kind){el.innerHTML='';const arr=state.nodes.filter(n=>n.kind===kind&&n.active).sort((a,b)=>a.stackIndex-b.stackIndex);const shown=Math.min(12,arr.length);for(let i=0;i<shown;i++){const d=document.createElement('div');d.className='stack-back';d.style.top=(131-i*12)+'px';d.style.zIndex=i;el.appendChild(d)}if(arr.length){const n=arr.at(-1),b=document.createElement('button');b.className='tile clickable stack-tile';if(isHint(n))b.classList.add('hint');b.dataset.id=n.id;b.textContent=TYPES[n.type];b.setAttribute('aria-label',TYPES[n.type]+' '+t('clearLabel'));b.onclick=()=>clickNode(n.id);el.appendChild(b)}}
function renderTray(){trayEl.innerHTML='';for(let i=0;i<7;i++){const s=document.createElement('div');s.className='slot';if(state.tray[i]){const c=document.createElement('div');c.className='tray-card';c.textContent=TYPES[state.tray[i].type];s.appendChild(c)}trayEl.appendChild(s)}reserveEl.innerHTML='';state.reserve.forEach((r,i)=>{const b=document.createElement('button');b.className='reserve-card';b.textContent=TYPES[r.type];b.setAttribute('aria-label',TYPES[r.type]+' '+t('reserveLabel'));b.onclick=()=>{if(state.ended)return;save();state.reserve.splice(i,1);const out=addToTray(r.type);renderAll();if(out)end(out)};reserveEl.appendChild(b)})}
function renderTools(){
  const rem=state.nodes.filter(n=>n.active).length+state.reserve.length+state.tray.length;
  document.querySelector('#progressFill').style.width=((state.startCount-rem)/state.startCount*100)+'%';
  document.querySelector('#status').textContent=t('remaining',{remaining:rem,total:state.startCount});
  for(const tool of ['shuffle','move','undo']){const button=document.querySelector('#'+tool+'Btn');button.querySelector('.count').textContent=state.tools[tool];button.disabled=state.ended||!state.tools[tool]||(tool==='move'&&!state.tray.length)||(tool==='undo'&&!state.history.length);button.title=t(tool+'Tip')}
}
function suggestedType(){return state.tray[0]?.type??state.nodes.find(n=>n.active&&!blocked(n))?.type}
function isHint(n){return state.hintId===n.id||(mode==='easy'&&state.matches===0&&!blocked(n)&&n.type===suggestedType())}
function renderGuide(){
  const count=state.tray.filter(n=>n.type===suggestedType()).length;
  const key=mode==='classic'?'classicGuide':state.matches?'matched':count===2?'two':count===1?'one':'intro';
  document.querySelector('#guideText').textContent=t(key,{animal:TYPES[suggestedType()]});
  document.querySelector('#feedback').textContent=state.feedback&&state.reserve.length===0?t(state.feedback,{count:state.matches}):'';if(state.reserve.length)document.querySelector('#guideText').textContent=t('moved');
}
function localize(){
  document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.title=t('title');
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll('[data-lang]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.lang===lang)));
  document.querySelectorAll('[data-mode]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.mode===mode)));
  document.querySelector('#languageSwitch').setAttribute('aria-label',t('language'));document.querySelector('#modeSwitch').setAttribute('aria-label',t('mode'));
  for(const [id,key] of [['newBtn','restart'],['helpBtn','hint']]){document.getElementById(id).title=t(key);document.getElementById(id).setAttribute('aria-label',t(key))}
  renderEnd();
}
function renderAll(){renderBoard();renderStack(document.querySelector('#leftStack'),'left');renderStack(document.querySelector('#rightStack'),'right');renderTray();renderTools();renderGuide()}
function newGame(reason='restart'){
  if(session){exit();track('game_restart',{reason})}
  hideEnd();clearTimeout(state.hintTimer);document.querySelector('#effects').replaceChildren();state.tray=[];state.reserve=[];state.history=[];state.ended=false;state.hintId=null;state.matches=0;state.feedback=null;state.tools={shuffle:1,move:1,undo:1};state.nodes=makeNodes();state.byId=new Map(state.nodes.map(n=>[n.id,n]));if(mode==='classic')assignSolvableTypes();state.startCount=state.nodes.length;
  session={ms:0,since:document.hidden?null:performance.now(),completed:false,outcome:null};localize();renderAll();track('game_start',{tile_count:state.startCount,reason});
}
document.querySelector('#shuffleBtn').onclick=()=>{if(state.ended||!state.tools.shuffle)return;save();state.tools.shuffle--;const active=state.nodes.filter(n=>n.active),vals=shuffle(active.map(n=>n.type));active.forEach((n,i)=>n.type=vals[i]);state.feedback='shuffled';track('tool_used',{tool:'shuffle'});renderAll()};
document.querySelector('#moveBtn').onclick=()=>{if(state.ended||!state.tools.move||!state.tray.length)return;save();state.tools.move--;state.reserve.push(...state.tray.splice(0,Math.min(3,state.tray.length)));state.feedback='moved';track('tool_used',{tool:'move'});renderAll()};
document.querySelector('#undoBtn').onclick=()=>{if(state.ended||!state.tools.undo||!state.history.length)return;const use=state.tools.undo-1,s=state.history.pop();restore(s);state.tools.undo=use;state.feedback='undone';track('tool_used',{tool:'undo'});renderAll()};
document.querySelector('#helpBtn').onclick=()=>{if(state.ended)return;const av=state.nodes.filter(n=>n.active&&!blocked(n));const n=av.find(x=>state.tray.some(t=>t.type===x.type))||av[0];if(n){clearTimeout(state.hintTimer);state.hintId=n.id;state.feedback='hintText';track('hint_used');renderAll();state.hintTimer=setTimeout(()=>{state.hintId=null;renderAll()},1500)}};
function changeMode(next){if(next===mode)return;const previous=mode;exit();mode=next;remember('mode',mode);track('mode_changed',{previous_mode:previous});newGame('mode_change')}
document.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>changeMode(button.dataset.mode));
document.querySelectorAll('[data-lang]').forEach(button=>button.onclick=()=>{if(lang===button.dataset.lang)return;const previous=lang;lang=button.dataset.lang;remember('language',lang);localize();renderAll();track('language_changed',{previous_language:previous})});
document.querySelector('#newBtn').onclick=()=>newGame();document.querySelector('#replayBtn').onclick=()=>newGame();document.querySelector('#classicNext').onclick=()=>changeMode('classic');
function fit(){const s=Math.min(innerWidth/1536,innerHeight/710);document.querySelector('#game').style.transform=`scale(${s})`}addEventListener('resize',fit);fit();localize();track('game_view');newGame('initial');
})();
</script>
</body></html>
