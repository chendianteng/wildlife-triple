<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>Forest Triple — Reference Layout v5</title>
<style>
:root{--tile:72px;--step:74px;--cream:#fffdf2;--deep:#0e6f63;--deep2:#075b57;--ink:#173f3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#087c77;font-family:ui-rounded,"SF Pro Rounded","PingFang SC",system-ui,sans-serif}
body{touch-action:manipulation}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#087c77}
#game{width:1536px;height:710px;position:relative;overflow:hidden;transform-origin:center center;background:
 radial-gradient(circle at 49% 48%,rgba(227,255,230,.95) 0 5%,rgba(102,236,214,.52) 27%,rgba(5,148,140,.4) 49%,rgba(5,97,101,.4) 72%),
 linear-gradient(145deg,#0a8b84,#18a996 45%,#08787b 77%,#075763)}
#game:before,#game:after{content:"";position:absolute;width:550px;height:550px;border:34px solid rgba(4,80,88,.20);border-radius:50% 20% 50% 20%;top:-272px;transform:rotate(23deg)}
#game:before{left:-220px}#game:after{right:-220px;transform:rotate(-23deg) scaleX(-1)}
#board{position:absolute;inset:0;z-index:10}
.tile{position:absolute;width:var(--tile);height:var(--tile);border:2px solid rgba(19,66,59,.88);border-radius:6px;background:var(--cream);display:grid;place-items:center;font-size:47px;line-height:1;box-shadow:0 2px 4px rgba(0,48,45,.28);padding:0;user-select:none}
.tile.blocked{filter:brightness(.48) saturate(.72);cursor:default}.tile.clickable{cursor:pointer;box-shadow:0 4px 8px rgba(0,48,45,.30),0 0 0 1px rgba(255,255,210,.35)}
.tile.clickable:hover{transform:translateY(-2px)}
.tile.hint{animation:pulse .7s ease-in-out infinite alternate}@keyframes pulse{to{box-shadow:0 0 20px 7px rgba(255,236,77,.95)}}
/* exact side-stack lanes from the reference screenshot */
.side-stack{position:absolute;width:72px;height:204px;top:295px;z-index:30000}
#leftStack{left:227px}#rightStack{left:891px}
.stack-back{position:absolute;left:0;width:72px;height:72px;border:2px solid #214f4b;border-radius:6px;background:#667f77;box-shadow:0 2px 3px rgba(0,0,0,.18)}
.stack-tile{left:0!important;top:131px!important;z-index:30200!important}
/* tray is kept in a dedicated band below the board; no board tile may enter this band */
#trayShell{position:absolute;left:307px;top:590px;width:707px;height:101px;border-radius:53px;background:linear-gradient(#e9ff9b,#daf58a);padding:11px 22px 11px 36px;box-shadow:0 5px 18px rgba(1,62,59,.34),inset 0 0 0 4px rgba(226,255,205,.35);z-index:40000}
#tray{height:79px;border-radius:27px;background:linear-gradient(#0d846f,#08705f);display:grid;grid-template-columns:repeat(7,1fr);align-items:center;padding:7px 8px;overflow:hidden}
.slot{height:64px;border-right:2px solid rgba(0,82,68,.35);display:flex;align-items:center;justify-content:center}.slot:last-child{border-right:0}
.tray-card{width:66px;height:66px;border-radius:6px;border:2px solid rgba(20,75,65,.76);background:var(--cream);display:grid;place-items:center;font-size:44px;box-shadow:0 2px 5px rgba(0,0,0,.18)}
#reserve{position:absolute;left:421px;top:521px;height:58px;display:flex;gap:6px;z-index:41000}.reserve-card{width:54px;height:54px;border:2px solid #9b873e;border-radius:6px;background:#fff5d7;font-size:35px;display:grid;place-items:center}
#toolbar{position:absolute;right:131px;top:58px;width:186px;z-index:50000;color:#fff}
.energy{display:flex;justify-content:center;gap:14px;font-size:34px;font-weight:1000;margin-bottom:17px}.caption{text-align:center;color:#a9e7d2;font-size:16px;margin-bottom:15px}
.tool{width:180px;height:89px;margin-bottom:16px;border:3px solid #f2c33b;border-radius:22px;background:linear-gradient(#fff8b5,#ffe26f);color:#b76a13;font-weight:900;font-size:20px;box-shadow:0 5px 8px rgba(0,65,61,.22);position:relative;cursor:pointer}.tool .ico{font-size:29px;display:block}.tool .count{position:absolute;right:-8px;top:-13px;background:#168f63;color:#eaffcf;border:3px solid #b9f6aa;width:37px;height:37px;border-radius:50%;display:grid;place-items:center;font-size:20px}
#mascot{position:absolute;right:87px;bottom:8px;font-size:116px;filter:drop-shadow(0 8px 10px rgba(0,65,59,.22));z-index:45000;pointer-events:none}
#helpBtn{position:absolute;right:206px;bottom:193px;width:38px;height:38px;border-radius:50%;border:3px solid rgba(174,238,193,.7);background:#3caa88;color:white;font-size:22px;font-weight:900;z-index:50000}
#newBtn{position:absolute;right:68px;top:8px;border:0;background:transparent;color:#eaffd6;font-size:38px;font-weight:1000;z-index:50000;cursor:pointer}
#status{position:absolute;left:1100px;top:22px;color:#dcfff1;font-size:14px;font-weight:800;z-index:50000}
#progress{position:absolute;left:628px;top:26px;width:202px;height:7px;border-radius:99px;background:rgba(2,75,78,.42);z-index:50000}#progress i{display:block;height:100%;width:2%;border-radius:inherit;background:#ffe78c}
#endOverlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,32,36,.54);z-index:1000000}#endOverlay.show{display:flex}
#endCard{width:390px;padding:30px 34px;border:4px solid #e2c24b;border-radius:24px;background:#fffbe1;color:#245950;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}#endCard h2{font-size:32px;margin:0 0 8px}#endCard p{font-size:17px;margin:0 0 18px}#endCard button{border:0;border-radius:14px;background:#138c70;color:white;font-size:18px;font-weight:900;padding:12px 24px;cursor:pointer}
#rotate{position:fixed;inset:0;display:none;z-index:2000000;align-items:center;justify-content:center;background:#0a756f;color:#edffe8;font-size:25px;font-weight:900;text-align:center}@media(orientation:portrait) and (max-width:900px){#rotate{display:flex}}
</style>
</head>
<body>
<div id="viewport"><div id="game">
  <div id="progress"><i id="progressFill"></i></div><div id="status"></div><button id="newBtn">↻</button>
  <div id="board"></div>
  <div id="leftStack" class="side-stack"></div><div id="rightStack" class="side-stack"></div>
  <div id="reserve"></div><div id="trayShell"><div id="tray"></div></div>
  <div id="toolbar"><div class="energy">⚡ <span>∞</span></div><div class="caption">三张相同自动消除</div>
    <button class="tool" id="shuffleBtn"><span class="ico">🔀</span>洗牌<span class="count">1</span></button>
    <button class="tool" id="moveBtn"><span class="ico">📤</span>移出<span class="count">1</span></button>
    <button class="tool" id="undoBtn"><span class="ico">↶</span>撤回<span class="count">1</span></button>
  </div>
  <button id="helpBtn">?</button><div id="mascot">🦦</div>
  <div id="endOverlay"><div id="endCard"><h2></h2><p></p><button>再来一局</button></div></div>
</div></div><div id="rotate">请将手机横过来玩</div>
<script>
(()=>{
'use strict';
const TYPES=["🐼","🦋","🐌","🐦","🦎","🦊","🐵","🐻","🌺","🌿","🌳","🐘"];
const TILE=72, STEP=74;
const state={nodes:[],byId:new Map(),tray:[],reserve:[],history:[],startCount:0,ended:false,hintId:null,tools:{shuffle:1,move:1,undo:1}};
const boardEl=document.querySelector('#board'),trayEl=document.querySelector('#tray'),reserveEl=document.querySelector('#reserve'),overlay=document.querySelector('#endOverlay');
const TOP_X=338, TOP_Y=56;
// Exact opening white-card geometry measured from the supplied screenshot.
const TOP=[
  [.5,0],[5.5,0],
  [0,1],[1,1],[2,1],[4,1],[5,1],[6,1],
  [0,2],[1,2],[2,2],[3,2],[4,2],[5,2],[6,2],
  [1,3],[2,3],[3,3],[4,3],[5,3],
  [2,4],[3,4],[4,4],
  [3,5]
];
// Deeper layers stay inside the same silhouette and become narrower toward the bottom.
// Counts: 24, 30, 30, 27, 24, 21, 18 = 174 central cards total.
const LAYERS=[
  // z0 (deepest, narrowest)
  [[2,1],[3,1],[4,1],[1.5,2],[2.5,2],[3.5,2],[4.5,2],[2,3],[3,3],[4,3],[2,4],[3,4],[4,4],[2.5,5],[3.5,5],[3,0],[2.5,1],[3.5,1]],
  // z1
  [[1.5,.5],[2.5,.5],[3.5,.5],[4.5,.5],[1,1.5],[2,1.5],[3,1.5],[4,1.5],[5,1.5],[1.5,2.5],[2.5,2.5],[3.5,2.5],[4.5,2.5],[2,3.5],[3,3.5],[4,3.5],[2.5,4.5],[3.5,4.5],[2.5,5],[3.5,5],[3,0]],
  // z2
  [[1,0],[2,0],[4,0],[5,0],[.5,1],[1.5,1],[2.5,1],[3.5,1],[4.5,1],[5.5,1],[1,2],[2,2],[3,2],[4,2],[5,2],[1.5,3],[2.5,3],[3.5,3],[4.5,3],[2,4],[3,4],[4,4],[2.5,5],[3.5,5]],
  // z3
  [[.5,.5],[1.5,.5],[4.5,.5],[5.5,.5],[0,1.5],[1,1.5],[2,1.5],[3,1.5],[4,1.5],[5,1.5],[6,1.5],[.5,2.5],[1.5,2.5],[2.5,2.5],[3.5,2.5],[4.5,2.5],[5.5,2.5],[1,3.5],[2,3.5],[3,3.5],[4,3.5],[5,3.5],[2,4.5],[3,4.5],[4,4.5],[2.5,5],[3.5,5]],
  // z4 — broad but still respects the side-stack corridors below y=278
  [[0,0],[1,0],[5,0],[6,0],[-1,1],[-.5,1],[.5,1],[1.5,1],[2.5,1],[3.5,1],[4.5,1],[5.5,1],[6.5,1],[7,1],[-1,2],[-.5,2],[.5,2],[1.5,2],[2.5,2],[3.5,2],[4.5,2],[5.5,2],[6.5,2],[7,2],[0,3],[1,3],[2,3],[4,3],[5,3],[6,3]],
  // z5 immediately under the white surface
  [[0,0],[1,0],[5,0],[6,0],[-1,1],[-.5,1],[.5,1],[1.5,1],[2.5,1],[3.5,1],[4.5,1],[5.5,1],[6.5,1],[7,1],[-1,2],[-.5,2],[.5,2],[1.5,2],[2.5,2],[3.5,2],[4.5,2],[5.5,2],[6.5,2],[7,2],[0,3],[1,3],[2,3],[4,3],[5,3],[6,3]],
  TOP
];
function makeNodes(){
  const nodes=[];let id=0;
  LAYERS.forEach((cells,z)=>cells.forEach(([gx,gy])=>nodes.push({id:'b'+id++,kind:'board',z,x:TOP_X+gx*STEP,y:TOP_Y+gy*STEP,active:true,type:0})));
  for(let i=0;i<12;i++)nodes.push({id:'l'+i,kind:'left',stackIndex:i,z:100+i,active:true,type:0});
  for(let i=0;i<12;i++)nodes.push({id:'r'+i,kind:'right',stackIndex:i,z:100+i,active:true,type:0});
  return nodes;
}
function overlap(a,b){return Math.abs(a.x-b.x)<TILE*.90&&Math.abs(a.y-b.y)<TILE*.90}
function blocked(n){
  if(!n.active)return true;
  if(n.kind!=='board')return state.nodes.some(x=>x.kind===n.kind&&x.active&&x.stackIndex>n.stackIndex);
  return state.nodes.some(x=>x.kind==='board'&&x.active&&x.z>n.z&&overlap(n,x));
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function assignSolvableTypes(){
  const order=[];
  for(let z=6;z>=0;z--){const ids=shuffle(state.nodes.filter(n=>n.kind==='board'&&n.z===z).map(n=>n.id));order.push(...ids)}
  const left=state.nodes.filter(n=>n.kind==='left').sort((a,b)=>b.stackIndex-a.stackIndex).map(n=>n.id);
  const right=state.nodes.filter(n=>n.kind==='right').sort((a,b)=>b.stackIndex-a.stackIndex).map(n=>n.id);
  // interleave side stacks modestly, preserving a legal peel order
  const side=[...left,...right];let si=0,merged=[];
  order.forEach((id,i)=>{merged.push(id);if(i%7===5&&si<side.length)merged.push(side[si++]);if(i%11===7&&si<side.length)merged.push(side[si++])});while(si<side.length)merged.push(side[si++]);
  // total is 198, divisible by 3
  let last=-1;
  for(let i=0;i<merged.length;i+=3){let t=Math.floor(Math.random()*TYPES.length);if(t===last)t=(t+1+Math.floor(Math.random()*(TYPES.length-1)))%TYPES.length;last=t;for(let k=0;k<3;k++)state.byId.get(merged[i+k]).type=t}
}
function snapshot(){return{active:state.nodes.map(n=>n.active),tray:state.tray.map(x=>({...x})),reserve:state.reserve.map(x=>({...x})),tools:{...state.tools},ended:state.ended}}
function restore(s){state.nodes.forEach((n,i)=>n.active=s.active[i]);state.tray=s.tray.map(x=>({...x}));state.reserve=s.reserve.map(x=>({...x}));state.tools={...s.tools};state.ended=s.ended;hideEnd();renderAll()}
function save(){state.history.push(snapshot());if(state.history.length>40)state.history.shift()}
function end(title,text){state.ended=true;document.querySelector('#endCard h2').textContent=title;document.querySelector('#endCard p').textContent=text;overlay.classList.add('show')}
function hideEnd(){overlay.classList.remove('show')}
function addToTray(type){
  let idx=-1;for(let i=state.tray.length-1;i>=0;i--)if(state.tray[i].type===type){idx=i;break}
  const e={type,uid:Math.random().toString(36).slice(2)};idx<0?state.tray.push(e):state.tray.splice(idx+1,0,e);
  let same=state.tray.filter(x=>x.type===type).length;
  if(same>=3){let removed=0;state.tray=state.tray.filter(x=>{if(x.type===type&&removed<3){removed++;return false}return true})}
  if(state.tray.length===7)return 'lose';
  const any=state.nodes.some(n=>n.active)||state.reserve.length;if(!any&&state.tray.length===0)return 'win';
  return null;
}
function clickNode(id){if(state.ended)return;const n=state.byId.get(id);if(!n||!n.active||blocked(n))return;save();n.active=false;const out=addToTray(n.type);renderAll();if(out==='lose')end('游戏结束','7 个卡槽已满，没有可消除的三张相同卡牌。');if(out==='win')end('通关！','全部卡牌已经清空。')}
function renderBoard(){boardEl.innerHTML='';state.nodes.filter(n=>n.kind==='board'&&n.active).sort((a,b)=>a.z-b.z||a.y-b.y||a.x-b.x).forEach(n=>{const b=document.createElement('button');b.className='tile '+(blocked(n)?'blocked':'clickable');b.style.left=n.x+'px';b.style.top=n.y+'px';b.style.zIndex=1000+n.z*1000+Math.round(n.y);b.textContent=TYPES[n.type];if(state.hintId===n.id)b.classList.add('hint');b.onclick=()=>clickNode(n.id);boardEl.appendChild(b)})}
function renderStack(el,kind){el.innerHTML='';const arr=state.nodes.filter(n=>n.kind===kind&&n.active).sort((a,b)=>a.stackIndex-b.stackIndex);const shown=Math.min(12,arr.length);for(let i=0;i<shown;i++){const d=document.createElement('div');d.className='stack-back';d.style.top=(131-i*12)+'px';d.style.zIndex=i;el.appendChild(d)}if(arr.length){const n=arr.at(-1),b=document.createElement('button');b.className='tile clickable stack-tile';b.textContent=TYPES[n.type];b.onclick=()=>clickNode(n.id);el.appendChild(b)}}
function renderTray(){trayEl.innerHTML='';for(let i=0;i<7;i++){const s=document.createElement('div');s.className='slot';if(state.tray[i]){const c=document.createElement('div');c.className='tray-card';c.textContent=TYPES[state.tray[i].type];s.appendChild(c)}trayEl.appendChild(s)}reserveEl.innerHTML='';state.reserve.forEach((r,i)=>{const b=document.createElement('button');b.className='reserve-card';b.textContent=TYPES[r.type];b.onclick=()=>{if(state.ended)return;save();state.reserve.splice(i,1);const out=addToTray(r.type);renderAll();if(out==='lose')end('游戏结束','7 个卡槽已满，没有可消除的三张相同卡牌。');if(out==='win')end('通关！','全部卡牌已经清空。')};reserveEl.appendChild(b)})}
function renderTools(){const rem=state.nodes.filter(n=>n.active).length+state.reserve.length,p=Math.round((state.startCount-rem)/state.startCount*100);document.querySelector('#progressFill').style.width=Math.max(2,p)+'%';document.querySelector('#status').textContent=`剩余 ${rem}/${state.startCount}`;document.querySelector('#shuffleBtn .count').textContent=state.tools.shuffle;document.querySelector('#moveBtn .count').textContent=state.tools.move;document.querySelector('#undoBtn .count').textContent=state.tools.undo}
function renderAll(){renderBoard();renderStack(document.querySelector('#leftStack'),'left');renderStack(document.querySelector('#rightStack'),'right');renderTray();renderTools()}
function newGame(){hideEnd();state.tray=[];state.reserve=[];state.history=[];state.ended=false;state.hintId=null;state.tools={shuffle:1,move:1,undo:1};state.nodes=makeNodes();state.byId=new Map(state.nodes.map(n=>[n.id,n]));assignSolvableTypes();state.startCount=state.nodes.length;renderAll()}
document.querySelector('#shuffleBtn').onclick=()=>{if(state.ended||!state.tools.shuffle)return;save();state.tools.shuffle--;const active=state.nodes.filter(n=>n.active),vals=shuffle(active.map(n=>n.type));active.forEach((n,i)=>n.type=vals[i]);renderAll()}
document.querySelector('#moveBtn').onclick=()=>{if(state.ended||!state.tools.move||!state.tray.length)return;save();state.tools.move--;state.reserve.push(...state.tray.splice(0,Math.min(3,state.tray.length)));renderAll()}
document.querySelector('#undoBtn').onclick=()=>{if(state.ended||!state.tools.undo||!state.history.length)return;const use=state.tools.undo-1,s=state.history.pop();restore(s);state.tools.undo=use;renderAll()}
document.querySelector('#helpBtn').onclick=()=>{if(state.ended)return;const av=state.nodes.filter(n=>n.active&&!blocked(n));let n=av.find(x=>state.tray.some(t=>t.type===x.type))||av[0];if(n){state.hintId=n.id;renderAll();setTimeout(()=>{state.hintId=null;renderAll()},1500)}}
document.querySelector('#newBtn').onclick=newGame;document.querySelector('#endCard button').onclick=newGame;
function fit(){const s=Math.min(innerWidth/1536,innerHeight/710);document.querySelector('#game').style.transform=`scale(${s})`}addEventListener('resize',fit);fit();newGame();
})();
</script>
</body></html>
